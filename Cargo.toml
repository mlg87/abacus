[package]
name = "abacus"
version = "0.2.0"
edition = "2024"
# ratatui 0.30 needs 1.88; checked with `cargo +1.88 build --locked`.
rust-version = "1.88"
description = "Terminal UI for viewing a beads graph and dispatching omp agents onto beads"
# The update check and `U` install read release tags from here.
repository = "https://github.com/mlg87/abacus"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
libc = "0.2"
regex = "1"

[dev-dependencies]
tempfile = "3"
