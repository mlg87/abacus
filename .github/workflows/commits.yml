name: Commits

on:
  pull_request:
    # `edited` re-checks a retitled PR; the title feeds the release notes.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The title goes through env, never inline: it is untrusted input.
      - run: scripts/conventional-commits.sh lint "origin/$BASE_REF" "$HEAD_SHA" "$PR_TITLE"
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}

  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Compares against the base branch as fetched now, not as of the event,
      # so a re-run after another PR's release asks for the next version.
      - run: scripts/conventional-commits.sh version "origin/$BASE_REF" "$HEAD_SHA" "$PR_TITLE"
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
